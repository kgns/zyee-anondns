-- Backend: local dnscrypt-proxy.
-- Health checks in LAZY mode: the backend is local and supervised (always up), so
-- the default 1/sec active probe (a.root-servers.net) is pointless noise. Lazy mode
-- does NO active polling during normal traffic — it watches real responses and only
-- starts probing (every 30s) if it sees a burst of failures, then marks it up again.
newServer({
  address = "127.0.0.1:5300", name = "dcp",
  healthCheckMode = "lazy",
  checkInterval = 60,                       -- probe cadence only while it's failing
  lazyHealthCheckSampleSize = 100,          -- look at the last 100 real responses
  lazyHealthCheckMinSampleCount = 10,       -- need >=10 samples before judging
  lazyHealthCheckThreshold = 30,            -- >=30% failures -> go into active probing
  lazyHealthCheckFailedInterval = 30,       -- probe every 30s while down
  lazyHealthCheckMode = "TimeoutOrServFail",
  maxCheckFailures = 3,
})

-- DoT listener (shares host netns; :53 is taken by gateway dnsmasq).
addTLSLocal("0.0.0.0:853",
            "/opt/anondns/etc/tls/fullchain.pem",
            "/opt/anondns/etc/tls/privkey.pem")

-- ---- Memory tuning for the 60 MB container cap (no root to raise it) ----
-- Default query/response rings are 10000 entries PER shard; we use neither top-N
-- nor dynamic blocks, so shrink them to almost nothing.
setRingBuffersSize(100, 1)
-- Default preallocates arrays sized to 65535 outstanding UDP queries per backend.
setMaxUDPOutstanding(1024)
-- One TCP/DoT worker thread is plenty for a home gateway and saves per-thread memory.
setMaxTCPClientThreads(1)
setMaxTCPConnectionsPerClient(20)

-- Small packet cache to respect the container memory cap.
getPool(""):setCache(newPacketCache(1000, {maxTTL = 86400, maxNegativeTTL = 3600}))
