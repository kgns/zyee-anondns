# Optional: makes the CPE's dnsmasq forward LAN DNS to dnscrypt-proxy.
# If this file exists, anondns.sh publishes it to the host's dnsmasq conf-dir
# (/var/dnsmasq/conf.d/00-anondns.conf) on boot. Delete this file to disable.
# Takes effect on dnsmasq's next restart (usually at WAN-up after boot); you can
# force it now with:  /etc/init.d/dnsmasq.sh restart
# ALSO required (web UI): hand LAN clients the router as their DNS (DHCP option 6
# = 192.168.1.1 / "DNS Relay"), else they bypass the router entirely.
no-resolv
server=127.0.0.1#5300
